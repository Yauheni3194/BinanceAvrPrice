spring.application.name=BinanceAvrPrice
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/BinanceAvrPrice_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# For http methods PUT, PATCH, DELETE
spring.mvc.hiddenmethod.filter.enabled=true
# For Flyway
spring.flyway.baseline-on-migrate=true
# specifying the Binance API and the polling interval for the scheduler
binance.api.base-url=${BINANCE_API_BASE_URL:https://api.binance.com}
binance.poll-interval=${BINANCE_POLL_INTERVAL:PT30S}


